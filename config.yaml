api:
  base_url: "https://ws01.cenace.gob.mx:8082/SWPML/SIM"
  sistema: "SIN"
  proceso: "MDA"            
  formato: "JSON"
  max_days_per_request: 7 #7 days since the CENACE manual estates that consult period can only be for a max of 7 days

period:
  start: "2024-01-01"
  end: "2025-06-30"

nodes:
  - "06AEO-115"
  - "06AHM-400"
  - "06FRO-115"
  - "06GRA-115"
  - "06MON-115"
  - "06MON-230"
  - "06RGS-115"
  - "06TKS-115"
  - "06XOC-115"

  #Adding settings for modeling, pml is what we are trying to predict, date is used to separate training data from test data, we are training on past 
  #to predict future, based on common 80/20 split. Also choosing a date with most volatility, kmay prices begin to raise, predictionn can be biases if I use the calm months only
  #same with hours, using the most expensive hours, this is where users find the tool more beneficial.\
  #Lags are the price N hours before the hour you’re predicting, 24, 48 and 168. 
modeling:
  target: "pml"
  split_date: "2025-04-01"     
  peak_hours: [18, 19, 20, 21]
  lags: [24, 48, 168]             